spring:
  application:
    name: fit-analizer
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fit_analizer}
    username: ${DB_USER:fit_analizer}
    password: ${DB_PASSWORD:fit_analizer}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

fitanalizer:
  claude:
    # ANTHROPIC_API_KEY é lida diretamente do ambiente pelo SDK, não daqui
    # (Spec F02, seção 1.2). Não confundir com o modelo/versão abaixo.
    model: ${CLAUDE_MODEL:claude-haiku-4-5}
    # Versão do CONTEÚDO do prompt (não do SDK/modelo) — persistida em
    # MatchResult.versaoPrompt, incrementar manualmente a cada mudança de
    # prompt (aciona o conjunto de regressão, PRD F02 seção 5).
    prompt-version: v3
    timeout-seconds: 60
  match:
    # Tamanho máximo do textoVaga em POST /matches (caracteres). Acima disso: 400,
    # sem chamar a Claude API — protege contra custo e contra colar a página inteira.
    vaga-max-chars: ${VAGA_MAX_CHARS:15000}
