name: CI

# Roda os testes em todo PR e em todo push para main.
# Não precisa de secrets: os testes mockam o FitAnalysisClient, então nenhuma
# chamada real à Claude API (nem ANTHROPIC_API_KEY) é necessária.
on:
  pull_request:
  push:
    branches: [main]

# Uma nova execução cancela a anterior da mesma branch/PR (evita fila de
# execuções velhas quando você empurra commits em sequência).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Inclui o MatchDedupIntegrationTest, que sobe um Postgres via
      # Testcontainers: os runners ubuntu-latest já têm Docker instalado.
      - name: Testes
        run: ./mvnw -B -ntp test
